services:
  - type: web
    name: mavlink-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app --workers 2 --timeout 300 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
    plan: free
